name: Website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate public files and links
        run: python3 Tools/validate-website.py

  deploy:
    name: Deploy website
    needs: validate
    if: github.repository == 'DimaMishchenko/Routine' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: Website/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
